name: Daily Bias Telegram

on:
  schedule:
    # รันทุก 4 ชั่วโมง (UTC)
    # 00:00, 04:00, 08:00, 12:00, 16:00, 20:00 UTC
    # ≈ 07:00, 11:00, 15:00, 19:00, 23:00, 03:00 เวลาไทย
    - cron: "0 */4 * * *"
  workflow_dispatch:  # ให้กดรันมือได้

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Bias Analyzer
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bias_analyzer.py
